# Sistema de diseño "minimalista ejecutivo".
# Los mismos tokens se replican en geoclima/ui/tema.py (Plotly, Folium, CSS).

[server]
headless = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter"
baseFontSize = 14
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f1f0ec"
textColor = "#0b0b0b"
linkColor = "#1c5cab"
borderColor = "#e1e0d9"
dataframeBorderColor = "#e1e0d9"
dataframeHeaderBackgroundColor = "#f4f3ef"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
metricValueFontSize = "1.6rem"
metricValueFontWeight = 600
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.sidebar]
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f4f3ef"
