[project]
name = "geoclima-cali"
version = "0.2.0"
description = "Plataforma de análisis espaciotemporal y monitoreo hidrometeorológico de Santiago de Cali"
requires-python = ">=3.11,<3.14"
# Todas las dependencias publican wheels nativos macOS arm64: no se requiere
# GDAL/PROJ del sistema (pyogrio y pyproj traen sus propias librerías).
dependencies = [
    "streamlit>=1.50",
    "streamlit-folium>=0.25",
    "folium>=0.19",
    "branca>=0.8",
    "plotly>=6.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "xarray>=2025.1",
    "netcdf4>=1.7",
    "h5netcdf>=1.4",
    "geopandas>=1.0",
    "pyogrio>=0.10",
    "pyproj>=3.7",
    "shapely>=2.0",
    "pyarrow>=18.0",
]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Reglas fijadas en el proyecto para que el resultado no dependa de la configuración global
select = ["E", "F", "W", "B"]
ignore = ["E501"]
